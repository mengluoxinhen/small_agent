[project]
name = "small-dify"
version = "0.1.0"
description = "Natural-language agent platform over self-written Python tools (FastAPI + Vue3)"
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.23.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: calls a real LLM API; requires .env and explicit `-m live`",
]

[tool.ruff]
line-length = 100
src = ["app", "tests", "scripts"]
